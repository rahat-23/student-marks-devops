name: Optional manual release to GitHub Container Registry

# Run manually from GitHub Actions only when you want to publish an image.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-after-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: "Quality gate: all six tests"
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build -t student-marks:release .

      - name: Publish image to GHCR (private by default)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker tag student-marks:release "$IMAGE"
          docker push "$IMAGE"
          echo "Published: $IMAGE"
